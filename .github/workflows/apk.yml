name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar
        run: |
          mkdir -p entrega
          cp app/build/outputs/apk/debug/app-debug.apk "entrega/boletas-${{ github.run_number }}.apk"

      - name: Publicar el APK como Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: entrega/*.apk
          prerelease: true

      - name: Guardar el APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: boletas-debug
          path: entrega/*.apk
          if-no-files-found: error
