name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Comprobar la firma
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          FIRMANTE=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          HUELLA=$("$FIRMANTE" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -1 | grep -oiE '[0-9a-f]{64}')
          ESPERADA="CC2C182D45F9467229BAF11E78CB519059766A5C29AC4263970D480D6A6F5144"
          echo "huella del APK: $HUELLA"
          echo "esperada:       $ESPERADA"
          if [ "${HUELLA^^}" != "$ESPERADA" ]; then
            echo "::warning::La huella no calza. Si el APK no se instala encima"
            echo "::warning::del anterior, revisa llave/depuracion.p12 en el repo."
          else
            echo "Firma correcta."
          fi

      - name: Renombrar
        run: |
          mkdir -p entrega
          cp app/build/outputs/apk/debug/app-debug.apk "entrega/boletas-${{ github.run_number }}.apk"
          ls -lh entrega/

      - name: Publicar el APK como Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          body: Compilado desde `${{ github.sha }}`. Bajalo desde Assets. Es el .apk directo.
          files: entrega/*.apk
          prerelease: true

      - name: Guardar el APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: boletas-debug
          path: entrega/*.apk
          if-no-files-found: error